<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL2QR - 스마트 QR 코드 생성기</title>
  <meta name="description" content="URL을 입력하여 간편하게 QR 코드를 생성하고 고화질 JPG 파일로 다운로드하세요.">
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
  <!-- QRCode.js 로컬 & CDN 폴백 -->
  <script src="qrcode.min.js"></script>
  <script>
    if (typeof QRCode === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div class="app-container" id="app">
    <!-- 배경 앰비언트 글로우 장식 -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="grid-overlay"></div>

    <!-- 1. 상단 헤더 (좌측 상단 로고) -->
    <header class="header">
      <div class="logo-wrapper" id="logoBtn" title="새로 만들기 / 처음으로">
        <!-- 상위 폴더 및 현재 폴더 모두 호환되도록 fallback 처리 -->
        <img 
          src="img/logo.png" 
          id="brandLogo" 
          alt="URL2QR 로고" 
          onerror="if(this.dataset.fallback !== '1'){ this.dataset.fallback='1'; this.src='logo.png'; } else { this.src='../img/logo.png'; }"
        />
        <span class="logo-subtext">Generator</span>
      </div>
      <div class="header-badges">
        <span class="tag-badge">High Quality JPG</span>
      </div>
    </header>

    <!-- 메인 인터랙션 래퍼 -->
    <main class="main-content">
      
      <!-- 3. 중앙에 나타날 QR 코드 영역 (초기엔 숨김/비활성화, 확인 누르면 중앙에 활성화) -->
      <section class="qr-display-section" id="qrDisplaySection" aria-live="polite">
        <div class="qr-card-container">
          <!-- 다운로드 안내 툴팁 / 뱃지 -->
          <div class="qr-hint-badge">
            <span class="pulse-dot"></span>
            QR 코드를 클릭하면 <strong>JPG 파일</strong>로 다운로드됩니다
          </div>

          <!-- 4. 클릭 시 다운로드되는 QR 코드 래퍼 -->
          <div class="qr-box" id="qrClickTarget" role="button" tabindex="0" title="클릭하여 JPG 다운로드">
            <div id="qrcodeCanvas"></div>
            <!-- 호버 시 나타나는 오버레이 안내 -->
            <div class="qr-hover-overlay">
              <div class="download-icon-circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </div>
              <span class="overlay-text">JPG 다운로드</span>
              <span class="overlay-sub">Click to Save</span>
            </div>
          </div>

          <!-- QR 대상 URL 요약 정보 -->
          <div class="qr-meta-info">
            <p class="target-url-label" id="targetUrlLabel">-</p>
          </div>

          <!-- 보조 액션 버튼들 -->
          <div class="qr-action-buttons">
            <button type="button" class="action-btn primary" id="btnDownloadJpg" title="고화질 JPG 다운로드">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>JPG 다운로드</span>
            </button>
            <button type="button" class="action-btn secondary" id="btnCopyImage" title="클립보드로 이미지 복사">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>이미지 복사</span>
            </button>
            <button type="button" class="action-btn secondary" id="btnReset" title="새로운 URL 입력">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
              </svg>
              <span>다시 만들기</span>
            </button>
          </div>
        </div>
      </section>

      <!-- 2. URL 입력 섹션 (초기에는 화면 중앙, 확인 후에는 하단으로 슬라이드 다운) -->
      <section class="url-input-section pos-center" id="urlInputSection">
        <div class="input-card">
          <!-- 히어로 텍스트 (초기 중앙에 있을 때 돋보이도록 구성) -->
          <div class="hero-intro" id="heroIntro">
            <h1 class="hero-title">링크를 입력하면 <span class="highlight">QR 코드</span>가 완성됩니다</h1>
            <p class="hero-desc">원하는 웹사이트나 링크 주소를 입력하고 확인을 눌러보세요.</p>
          </div>

          <!-- 심플한 URL 입력 폼 -->
          <form class="url-form" id="urlForm" onsubmit="return false;">
            <div class="input-group">
              <span class="input-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </span>
              <input 
                type="text" 
                id="urlInput" 
                class="url-input" 
                placeholder="https:// 또는 링크 주소를 입력해주세요" 
                autocomplete="off" 
                spellcheck="false"
                required
              />
              <button type="button" class="input-clear-btn" id="btnClearInput" title="입력 지우기" aria-label="입력 지우기">
                ✕
              </button>
              <button type="button" class="paste-btn" id="btnPaste" title="클립보드 붙여넣기">
                붙여넣기
              </button>
            </div>

            <!-- 확인 버튼 -->
            <button type="submit" class="submit-btn" id="btnSubmit">
              <span>확인</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>

          <!-- 유효성 에러 메시지 -->
          <div class="error-msg" id="errorMsg" style="display: none;"></div>
        </div>
      </section>

    </main>

    <!-- 토스트 알림 메시지 -->
    <div class="toast-container" id="toastContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
